<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 진단 신청 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1714; --ink-mid: #4a4540; --ink-soft: #8a8278;
    --paper: #f7f4ef; --paper-warm: #ede8e0;
    --accent: #c4380a; --line: rgba(26,23,20,0.12);
    --sans: 'Noto Sans KR', sans-serif; --mono: 'DM Mono', monospace;
    --green: #2e7d32; --orange: #e65100; --blue: #0d47a1; --gray: #5f5e5a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 300; }

  /* LOGIN */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    width: 360px; padding: 3rem 2.5rem;
    border: 0.5px solid var(--line); background: #fff;
  }
  .login-title {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    color: var(--ink-soft); margin-bottom: 2rem;
  }
  .login-input {
    width: 100%; border: 0.5px solid var(--line); background: var(--paper);
    font-family: var(--sans); font-size: 14px; padding: 0.8rem 1rem;
    margin-bottom: 1rem; outline: none; border-radius: 2px;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; background: var(--ink); color: var(--paper);
    border: none; font-family: var(--sans); font-size: 14px; font-weight: 500;
    padding: 0.85rem; cursor: pointer; border-radius: 2px; transition: all 0.2s;
  }
  .login-btn:hover { background: var(--accent); }
  .login-error { font-size: 12px; color: var(--accent); margin-top: 0.5rem; display: none; }

  /* ADMIN */
  #adminScreen { display: none; }
  .admin-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink); color: var(--paper);
    padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
  }
  .admin-header-brand { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }
  .admin-header-right { display: flex; align-items: center; gap: 1.5rem; }
  .refresh-btn {
    font-family: var(--mono); font-size: 11px; color: rgba(247,244,239,0.6);
    background: none; border: 0.5px solid rgba(247,244,239,0.2);
    padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 2px;
    transition: all 0.2s;
  }
  .refresh-btn:hover { color: var(--paper); border-color: rgba(247,244,239,0.5); }
  .logout-btn {
    font-size: 12px; color: rgba(247,244,239,0.5);
    background: none; border: none; cursor: pointer; font-family: var(--sans);
  }
  .logout-btn:hover { color: var(--paper); }

  .admin-stats {
    background: var(--paper-warm); padding: 1.5rem 2rem;
    display: flex; gap: 2rem; border-bottom: 0.5px solid var(--line);
  }
  .stat-pill {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono); font-size: 12px; color: var(--ink-mid);
  }
  .stat-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .admin-filters {
    padding: 1rem 2rem; display: flex; gap: 1rem; align-items: center;
    border-bottom: 0.5px solid var(--line); flex-wrap: wrap;
  }
  .filter-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em;
    padding: 0.4rem 0.8rem; border: 0.5px solid var(--line);
    background: none; cursor: pointer; border-radius: 2px; color: var(--ink-mid);
    transition: all 0.2s;
  }
  .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .search-input {
    font-family: var(--sans); font-size: 13px;
    border: 0.5px solid var(--line); padding: 0.4rem 0.8rem;
    background: var(--paper); border-radius: 2px; outline: none;
    margin-left: auto; min-width: 200px;
  }
  .search-input:focus { border-color: var(--accent); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.1em; color: var(--ink-soft);
    padding: 0.8rem 1rem; border-bottom: 0.5px solid var(--line);
    background: var(--paper-warm); font-weight: 400;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 0.5px solid var(--line); cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:hover { background: rgba(196,56,10,0.03); }
  td { padding: 0.9rem 1rem; vertical-align: top; }
  .td-name { font-weight: 500; white-space: nowrap; }
  .td-phone { font-family: var(--mono); font-size: 12px; color: var(--ink-mid); }
  .td-type { white-space: nowrap; }
  .td-location { color: var(--ink-mid); }
  .td-invest { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .td-stage { font-size: 12px; color: var(--ink-mid); }
  .td-concern { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-mid); }
  .td-date { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }

  /* STATUS BADGE */
  .status-badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 0.2rem 0.6rem; border-radius: 20px; white-space: nowrap;
    font-family: var(--mono); letter-spacing: 0.05em;
  }
  .status-new { background: #fff3e0; color: #e65100; }
  .status-reviewing { background: #e3f2fd; color: #0d47a1; }
  .status-done { background: #e8f5e9; color: #2e7d32; }
  .status-rejected { background: #fce4ec; color: #880e4f; }

  /* LOADING / EMPTY */
  .table-message {
    text-align: center; padding: 4rem; color: var(--ink-soft);
    font-size: 14px;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,23,20,0.7);
    z-index: 200; display: none; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper); width: 100%; max-width: 640px;
    max-height: 90vh; overflow-y: auto;
    border-radius: 2px;
  }
  .modal-header {
    padding: 1.5rem 2rem; border-bottom: 0.5px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--paper); z-index: 1;
  }
  .modal-title { font-size: 15px; font-weight: 500; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--ink-soft); line-height: 1;
  }
  .modal-body { padding: 2rem; }
  .modal-field { margin-bottom: 1.5rem; }
  .modal-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    color: var(--ink-soft); margin-bottom: 0.4rem; display: block;
  }
  .modal-value {
    font-size: 14px; line-height: 1.7; word-break: keep-all;
  }
  .modal-concern {
    background: var(--paper-warm); padding: 1rem 1.2rem;
    border-left: 2px solid var(--accent); font-size: 14px;
    line-height: 1.8; word-break: keep-all;
  }
  .modal-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .status-btn {
    font-size: 12px; font-weight: 500; font-family: var(--mono);
    padding: 0.4rem 0.8rem; border-radius: 2px; cursor: pointer;
    border: 0.5px solid; transition: all 0.2s; letter-spacing: 0.05em;
  }
  .memo-textarea {
    width: 100%; border: 0.5px solid var(--line); background: var(--paper);
    font-family: var(--sans); font-size: 13px; font-weight: 300;
    padding: 0.8rem 1rem; border-radius: 2px; outline: none;
    resize: vertical; min-height: 80px; line-height: 1.7;
  }
  .memo-textarea:focus { border-color: var(--accent); }
  .save-memo-btn {
    margin-top: 0.5rem; background: var(--ink); color: var(--paper);
    border: none; font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 0.6rem 1.2rem; border-radius: 2px; cursor: pointer;
  }
  .save-memo-btn:hover { background: var(--accent); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <p class="login-title">WISESPRING · ADMIN</p>
    <input type="password" class="login-input" id="pwInput" placeholder="관리자 비밀번호" />
    <button class="login-btn" onclick="checkLogin()">로그인</button>
    <p class="login-error" id="loginError">비밀번호가 맞지 않습니다.</p>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">
  <div class="admin-header">
    <span class="admin-header-brand">WISESPRING · ADMIN</span>
    <div class="admin-header-right">
      <button class="refresh-btn" onclick="loadData()">새로고침</button>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="admin-stats" id="statsBar">
    <div class="stat-pill"><div class="stat-dot" style="background:#e65100"></div><span id="cnt-new">0</span> 신규</div>
    <div class="stat-pill"><div class="stat-dot" style="background:#0d47a1"></div><span id="cnt-reviewing">0</span> 검토중</div>
    <div class="stat-pill"><div class="stat-dot" style="background:#2e7d32"></div><span id="cnt-done">0</span> 완료</div>
    <div class="stat-pill"><div class="stat-dot" style="background:#880e4f"></div><span id="cnt-rejected">0</span> 거절</div>
    <div class="stat-pill" style="margin-left:auto"><div class="stat-dot" style="background:#8a8278"></div>전체 <span id="cnt-total">0</span></div>
  </div>

  <div class="admin-filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
    <button class="filter-btn" onclick="setFilter('new', this)">신규</button>
    <button class="filter-btn" onclick="setFilter('reviewing', this)">검토중</button>
    <button class="filter-btn" onclick="setFilter('done', this)">완료</button>
    <button class="filter-btn" onclick="setFilter('rejected', this)">거절</button>
    <input type="text" class="search-input" id="searchInput" placeholder="이름, 업종, 지역 검색..." oninput="renderTable()">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>상태</th><th>이름</th><th>연락처</th><th>업종</th>
          <th>지역</th><th>투자금액</th><th>단계</th><th>고민</th><th>신청일</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="tableMessage" class="table-message">로딩 중...</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">신청 상세</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  // TODO: Firebase 설정값 교체 필요 (index.html과 동일)
  const firebaseConfig = {
    apiKey: "AIzaSyAua5nOaTMw5MCXkhhUk7hY_VALjPW1e_M",
    authDomain: "area-insight.firebaseapp.com",
    projectId: "area-insight",
    storageBucket: "area-insight.firebasestorage.app",
    messagingSenderId: "595540810642",
    appId: "1:595540810642:web:aa13fd4d3351589d0cff4b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 간단 비밀번호 (실제 운영 시 변경 필요)
  const ADMIN_PW = 'wisespring2025';

  let allData = [];
  let currentFilter = 'all';
  let currentDoc = null;

  window.checkLogin = () => {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PW) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  };

  document.getElementById('pwInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.checkLogin();
  });

  window.logout = () => {
    document.getElementById('adminScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  };

  window.loadData = async () => {
    document.getElementById('tableMessage').textContent = '로딩 중...';
    document.getElementById('tableMessage').style.display = 'block';
    document.getElementById('tableBody').innerHTML = '';
    try {
      const q = query(collection(db, 'diagnosis'), orderBy('created_at', 'desc'));
      const snap = await getDocs(q);
      allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats();
      renderTable();
    } catch (e) {
      document.getElementById('tableMessage').textContent = 'Firebase 설정을 확인해주세요.';
    }
  };

  function updateStats() {
    const counts = { new: 0, reviewing: 0, done: 0, rejected: 0 };
    allData.forEach(d => { if (counts[d.status] !== undefined) counts[d.status]++; });
    document.getElementById('cnt-new').textContent = counts.new;
    document.getElementById('cnt-reviewing').textContent = counts.reviewing;
    document.getElementById('cnt-done').textContent = counts.done;
    document.getElementById('cnt-rejected').textContent = counts.rejected;
    document.getElementById('cnt-total').textContent = allData.length;
  }

  window.setFilter = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  };

  window.renderTable = () => {
    const search = document.getElementById('searchInput').value.toLowerCase();
    let data = allData;
    if (currentFilter !== 'all') data = data.filter(d => d.status === currentFilter);
    if (search) data = data.filter(d =>
      (d.name||'').toLowerCase().includes(search) ||
      (d.business_type||'').toLowerCase().includes(search) ||
      (d.location||'').toLowerCase().includes(search)
    );

    const body = document.getElementById('tableBody');
    const msg = document.getElementById('tableMessage');

    if (data.length === 0) {
      body.innerHTML = '';
      msg.textContent = '해당하는 신청이 없습니다.';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';

    const statusLabel = { new: '신규', reviewing: '검토중', done: '완료', rejected: '거절' };
    const statusClass = { new: 'status-new', reviewing: 'status-reviewing', done: 'status-done', rejected: 'status-rejected' };

    body.innerHTML = data.map(d => {
      const date = d.created_at ? new Date(d.created_at.seconds * 1000).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' }) : '-';
      const status = d.status || 'new';
      return `<tr onclick="openModal('${d.id}')">
        <td><span class="status-badge ${statusClass[status]}">${statusLabel[status]||status}</span></td>
        <td class="td-name">${d.name||'-'}</td>
        <td class="td-phone">${d.phone||'-'}</td>
        <td class="td-type">${d.business_type||'-'}</td>
        <td class="td-location">${d.location||'-'}</td>
        <td class="td-invest">${d.investment||'-'}</td>
        <td class="td-stage">${d.stage||'-'}</td>
        <td class="td-concern">${d.concern||'-'}</td>
        <td class="td-date">${date}</td>
      </tr>`;
    }).join('');
  };

  window.openModal = (id) => {
    const d = allData.find(x => x.id === id);
    if (!d) return;
    currentDoc = d;
    const statusLabel = { new: '신규', reviewing: '검토중', done: '완료', rejected: '거절' };
    const date = d.created_at ? new Date(d.created_at.seconds * 1000).toLocaleString('ko-KR') : '-';
    document.getElementById('modalTitle').textContent = `${d.name} 님의 신청`;
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-field">
        <span class="modal-label">상태 변경</span>
        <div class="modal-actions">
          <button class="status-btn" style="border-color:#e65100;color:#e65100" onclick="changeStatus('new')">신규</button>
          <button class="status-btn" style="border-color:#0d47a1;color:#0d47a1" onclick="changeStatus('reviewing')">검토중</button>
          <button class="status-btn" style="border-color:#2e7d32;color:#2e7d32" onclick="changeStatus('done')">완료</button>
          <button class="status-btn" style="border-color:#880e4f;color:#880e4f" onclick="changeStatus('rejected')">거절</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem">
        <div class="modal-field" style="margin:0">
          <span class="modal-label">이름</span>
          <p class="modal-value">${d.name||'-'}</p>
        </div>
        <div class="modal-field" style="margin:0">
          <span class="modal-label">연락처</span>
          <p class="modal-value">${d.phone||'-'}</p>
        </div>
        <div class="modal-field" style="margin:0">
          <span class="modal-label">업종</span>
          <p class="modal-value">${d.business_type||'-'}</p>
        </div>
        <div class="modal-field" style="margin:0">
          <span class="modal-label">지역</span>
          <p class="modal-value">${d.location||'-'}</p>
        </div>
        <div class="modal-field" style="margin:0">
          <span class="modal-label">투자 예정 금액</span>
          <p class="modal-value">${d.investment||'-'}</p>
        </div>
        <div class="modal-field" style="margin:0">
          <span class="modal-label">현재 단계</span>
          <p class="modal-value">${d.stage||'-'}</p>
        </div>
      </div>
      <div class="modal-field">
        <span class="modal-label">가장 큰 고민</span>
        <div class="modal-concern">${d.concern||'-'}</div>
      </div>
      <div class="modal-field">
        <span class="modal-label">신청일시</span>
        <p class="modal-value" style="font-family:var(--mono);font-size:12px">${date}</p>
      </div>
      <div class="modal-field">
        <span class="modal-label">메모</span>
        <textarea class="memo-textarea" id="memoText">${d.memo||''}</textarea>
        <button class="save-memo-btn" onclick="saveMemo()">메모 저장</button>
      </div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
  };

  window.closeModal = (e) => {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
  };
  window.closeModalDirect = () => {
    document.getElementById('modalOverlay').classList.remove('open');
    currentDoc = null;
  };

  window.changeStatus = async (status) => {
    if (!currentDoc) return;
    try {
      await updateDoc(doc(db, 'diagnosis', currentDoc.id), { status });
      currentDoc.status = status;
      const idx = allData.findIndex(x => x.id === currentDoc.id);
      if (idx >= 0) allData[idx].status = status;
      updateStats();
      renderTable();
      alert(`상태를 '${status}'으로 변경했습니다.`);
    } catch (e) { alert('변경 실패: ' + e.message); }
  };

  window.saveMemo = async () => {
    if (!currentDoc) return;
    const memo = document.getElementById('memoText').value;
    try {
      await updateDoc(doc(db, 'diagnosis', currentDoc.id), { memo });
      currentDoc.memo = memo;
      const idx = allData.findIndex(x => x.id === currentDoc.id);
      if (idx >= 0) allData[idx].memo = memo;
      alert('메모가 저장되었습니다.');
    } catch (e) { alert('저장 실패: ' + e.message); }
  };
</script>
</body>
</html>
